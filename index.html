<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, 25vmax);
            gap: 1vmax;
            padding: 1vmax;
            justify-content: center;
        }

        .grid-item {
            width: 25vmax;
            height: 25vmax;
            max-width: 100vw;
            max-height: 100vh;
            display: block;
            transition: transform 0.3s ease;
        }

        .grid-item:hover {
            transform: scale(1.05);
        }

        .grid-item:active {
            transform: scale(0.95);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: pixelated;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>

        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
        <a href="runner/" class="grid-item"><img src="runner/thumbnail.png"></a>
    </div>
</body>
</html>
