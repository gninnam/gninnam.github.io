<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, 25vmax);
            gap: 10px;
            padding: 10px;
            justify-content: center;
        }

        .grid-item {
            width: 25vmax;
            height: 25vmax;
            display: block;
            transition: transform 0.3s ease;
        }

        .grid-item:hover {
            transform: scale(1.05);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 1">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 2">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 3">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 4">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 5">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 6">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 7">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 8">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 9">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 10">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 11">
        </a>
        <a href="runner.html" class="grid-item">
            <img src="thumbnails/runner.png" alt="Image 12">
        </a>
    </div>
</body>
</html>
